[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docfiller"
version = "1.0.2"
description = "DocFiller — Extrator Inteligente de Documentos Brasileiros e Gestão de Sessões com IA e Conformidade LGPD"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "DocFiller Team" }
]
dependencies = [
    "pydantic>=2.5.0",
    "PyYAML>=6.0.1",
    "PyMuPDF>=1.23.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.2.0",
    "google-genai>=2.3.0",
    "selenium>=4.18.0",
    "PySide6>=6.6.2",
    "PySide6-Fluent-Widgets>=1.6.0",
]

[project.scripts]
docfiller = "main:main"
